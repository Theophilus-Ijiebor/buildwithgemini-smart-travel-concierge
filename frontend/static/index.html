<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Travel Concierge - AI Destination Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-light: #ccfbf1;
    --gradient-accent: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
    --bg-page: #f8fafc;
    --bg-surface: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 10px 25px -5px rgba(13, 148, 136, 0.1);
    --shadow-glow: 0 0 20px rgba(13, 148, 136, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .app-container {
    width: 100%;
    max-width: 900px;
    height: 92vh;
    background: var(--bg-surface);
    border-radius: 24px;
    box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.08), 0 0 1px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(226, 232, 240, 0.8);
  }

  header {
    background: var(--gradient-accent);
    color: #ffffff;
    padding: 1.1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(13, 148, 136, 0.2);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .header-avatar {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .header-info h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .header-info p {
    font-size: 0.8rem;
    opacity: 0.9;
    font-weight: 500;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: rgba(255, 255, 255, 0.18);
    padding: 0.3rem 0.7rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    gap: 0.75rem;
    max-width: 85%;
    animation: fadeIn 0.25s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg.agent {
    align-self: flex-start;
  }

  .msg-avatar {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  .msg.agent .msg-avatar {
    background: var(--accent-light);
    color: var(--accent);
    border: 1px solid rgba(13, 148, 136, 0.2);
  }

  .msg.user .msg-avatar {
    background: #f1f5f9;
    color: var(--text-secondary);
  }

  .bubble {
    padding: 0.85rem 1.1rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
    position: relative;
  }

  .msg.user .bubble {
    background: var(--gradient-accent);
    color: #ffffff;
    border-top-right-radius: 4px;
    box-shadow: var(--shadow-glow);
  }

  .msg.agent .bubble {
    background: #ffffff;
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    box-shadow: var(--shadow-sm);
  }

  .bubble.rich {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    box-shadow: none !important;
    white-space: normal;
    width: 100%;
  }

  /* --- Typing Indicator Animation --- */
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0.4rem 0.2rem;
  }
  .typing-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: typingBounce 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1.1); opacity: 1; }
  }

  /* --- Attachments & Connectors Bar --- */
  .toolbar-container {
    padding: 0.6rem 1.25rem 0.3rem;
    background: #ffffff;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .attach-btn, .skill-btn {
    border: 1px dashed var(--accent);
    background: var(--accent-light);
    color: var(--accent-dark);
    padding: 0.45rem 0.85rem;
    border-radius: 18px;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    transition: all 0.2s ease;
  }

  .attach-btn:hover, .skill-btn:hover {
    background: var(--accent);
    color: #ffffff;
    border-style: solid;
  }

  .skill-badge {
    background: rgba(13, 148, 136, 0.12);
    color: var(--accent-dark);
    border: 1px solid rgba(13, 148, 136, 0.25);
    padding: 0.25rem 0.65rem;
    border-radius: 14px;
    font-size: 0.75rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .attachment-chip {
    background: #e0f2fe;
    color: #0369a1;
    border: 1px solid #bae6fd;
    padding: 0.3rem 0.75rem;
    border-radius: 16px;
    font-size: 0.8rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin: 0.3rem 1.25rem 0;
  }

  .remove-chip {
    cursor: pointer;
    font-weight: bold;
    opacity: 0.75;
  }
  .remove-chip:hover { opacity: 1; color: #ef4444; }

  /* --- Example Prompts Row --- */
  .prompts-container {
    padding: 0.4rem 1.25rem 0.25rem;
    background: #ffffff;
  }

  .prompts-row {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.25rem;
    scrollbar-width: none;
  }

  .prompts-row::-webkit-scrollbar { display: none; }

  .prompt-btn {
    border: 1px solid var(--border);
    background: var(--bg-page);
    color: var(--text-secondary);
    padding: 0.5rem 0.9rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .prompt-btn:hover {
    background: var(--accent-light);
    color: var(--accent-dark);
    border-color: rgba(13, 148, 136, 0.4);
    transform: translateY(-1px);
  }

  /* --- Input Bar --- */
  form {
    display: flex;
    gap: 0.6rem;
    padding: 0.6rem 1.25rem 1.1rem;
    background: #ffffff;
    align-items: center;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }

  input {
    width: 100%;
    padding: 0.85rem 1.2rem;
    border: 1px solid var(--border);
    border-radius: 24px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--bg-page);
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s ease;
  }

  input:focus {
    background: #ffffff;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.12);
  }

  button.send-btn {
    padding: 0.85rem 1.3rem;
    border: none;
    border-radius: 24px;
    background: var(--gradient-accent);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: var(--shadow-glow);
    transition: all 0.2s ease;
  }

  button.send-btn:hover {
    opacity: 0.95;
    transform: translateY(-1px);
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem;
    background: #ffffff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    max-width: 100%;
    margin-top: 0.4rem;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="header-brand">
      <div class="header-avatar">🧳</div>
      <div class="header-info">
        <h1>Smart Travel Concierge</h1>
        <p>AI Destination Guide & Itinerary Planner</p>
      </div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Online</span>
    </div>
  </header>

  <div id="log"></div>

  <!-- Attachments & Connectors Toolbar -->
  <div class="toolbar-container">
    <div class="toolbar-group">
      <button type="button" class="attach-btn" onclick="document.getElementById('file-input').click()">
        📎 Attach Document
      </button>
      <input type="file" id="file-input" style="display:none" accept=".txt,.pdf,.md,.json,.csv" onchange="handleFileSelect(event)">
      
      <div style="position:relative; display:inline-block;">
        <button type="button" class="skill-btn" onclick="toggleSkillsMenu()">
          🧩 Connectors & Skills ▾
        </button>
        <div id="skills-menu" style="display:none; position:absolute; bottom:110%; left:0; background:#ffffff; border:1px solid var(--border); border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,0.15); padding:0.6rem; z-index:100; min-width:220px;">
          <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); padding:0.3rem 0.4rem; text-transform:uppercase;">Active Plugins & Connectors</div>
          <label style="display:flex; align-items:center; gap:0.5rem; padding:0.4rem; font-size:0.83rem; cursor:pointer;" class="menu-item">
            <input type="checkbox" id="connector-expedia" onchange="updateSkills()"> 🧳 Expedia Travel API
          </label>
          <label style="display:flex; align-items:center; gap:0.5rem; padding:0.4rem; font-size:0.83rem; cursor:pointer;" class="menu-item">
            <input type="checkbox" id="connector-gmail" onchange="updateSkills()"> 📧 Gmail Itinerary Sync
          </label>
          <label style="display:flex; align-items:center; gap:0.5rem; padding:0.4rem; font-size:0.83rem; cursor:pointer;" class="menu-item">
            <input type="checkbox" id="connector-slack" onchange="updateSkills()"> 💬 Slack Team Updates
          </label>
          <label style="display:flex; align-items:center; gap:0.5rem; padding:0.4rem; font-size:0.83rem; cursor:pointer;" class="menu-item">
            <input type="checkbox" id="connector-flight" onchange="updateSkills()"> ✈️ Flight & Hotel Connector
          </label>
          <label style="display:flex; align-items:center; gap:0.5rem; padding:0.4rem; font-size:0.83rem; cursor:pointer;" class="menu-item">
            <input type="checkbox" id="connector-budget" onchange="updateSkills()"> 💰 Budget Specialist Skill
          </label>
          <label style="display:flex; align-items:center; gap:0.5rem; padding:0.4rem; font-size:0.83rem; cursor:pointer;" class="menu-item">
            <input type="checkbox" id="connector-guide" onchange="updateSkills()"> 🗺️ Local Secrets Skill
          </label>
        </div>
      </div>
    </div>
    <div id="active-skills-list" class="toolbar-group"></div>
  </div>

  <!-- Attachment preview tag -->
  <div id="attachment-preview"></div>

  <div class="prompts-container">
    <div class="prompts-row">
      <button type="button" class="prompt-btn" onclick="sendPrompt('Find top attractions in Shibuya, Tokyo')">🗺️ Top places in Shibuya</button>
      <button type="button" class="prompt-btn" onclick="sendPrompt('Search Expedia for top flights and hotels in Tokyo')">🧳 Search Expedia Deals</button>
      <button type="button" class="prompt-btn" onclick="sendPrompt('Check Gmail for my flight confirmation and post itinerary to Slack')">📧 Sync Gmail & Slack</button>
    </div>
  </div>

  <form id="form">
    <div class="input-wrapper">
      <input id="input" placeholder="Ask about destinations, weather, currency, or itinerary..." autocomplete="off" autofocus>
    </div>
    <button class="send-btn">
      <span>Send</span>
      <span style="font-size: 1.1rem;">›</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const skillsMenu = document.getElementById("skills-menu");
const activeSkillsList = document.getElementById("active-skills-list");
const attachmentPreview = document.getElementById("attachment-preview");

let attachedFile = null; // { name: string, content: string }

function toggleSkillsMenu() {
  skillsMenu.style.display = skillsMenu.style.display === "none" ? "block" : "none";
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".skill-btn") && !e.target.closest("#skills-menu")) {
    skillsMenu.style.display = "none";
  }
});

function updateSkills() {
  activeSkillsList.innerHTML = "";
  const skills = [
    { id: "connector-expedia", label: "🧳 Expedia API" },
    { id: "connector-gmail", label: "📧 Gmail Sync" },
    { id: "connector-slack", label: "💬 Slack Integration" },
    { id: "connector-flight", label: "✈️ Flight & Hotel" },
    { id: "connector-budget", label: "💰 Budget Skill" },
    { id: "connector-guide", label: "🗺️ Local Guide" }
  ];
  skills.forEach(s => {
    const cb = document.getElementById(s.id);
    if (cb && cb.checked) {
      const badge = el("div", "skill-badge", s.label);
      const rm = el("span", "remove-chip", " ✕");
      rm.onclick = () => { cb.checked = false; updateSkills(); };
      badge.appendChild(rm);
      activeSkillsList.appendChild(badge);
    }
  });
}

function handleFileSelect(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    attachedFile = { name: file.name, content: e.target.result };
    renderAttachmentPreview();
  };
  reader.readAsText(file);
}

function renderAttachmentPreview() {
  attachmentPreview.innerHTML = "";
  if (!attachedFile) return;
  const chip = el("div", "attachment-chip", `📄 ${attachedFile.name} (${attachedFile.content.length} chars)`);
  const rm = el("span", "remove-chip", " ✕");
  rm.onclick = () => {
    attachedFile = null;
    document.getElementById("file-input").value = "";
    renderAttachmentPreview();
  };
  chip.appendChild(rm);
  attachmentPreview.appendChild(chip);
}

function sendPrompt(text) {
  input.value = text;
  form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', {cancelable: true}));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "msg-avatar", who === "user" ? "👤" : "🧳");
  const b = el("div", "bubble");
  m.appendChild(avatar);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": { const d = el("div", "a2card"); kids().forEach(k => d.appendChild(k)); return d; }
    case "Column": { const d = el("div", "a2col"); kids().forEach(k => d.appendChild(k)); return d; }
    case "Row": {
      const d = el("div", "a2row");
      if (boundStr(props.distribution) === "space-between") d.classList.add("between");
      kids().forEach(k => d.appendChild(k));
      return d;
    }
    case "Text": {
      const t = boundStr(props.text);
      const style = boundStr(props.usage);
      const cls = "a2text " + (style ? "a2-" + style.toLowerCase() : "");
      return el("div", cls, t);
    }
    case "Divider": return el("hr", "a2divider");
    case "Image": {
      const img = el("img", "a2img");
      img.src = boundStr(props.url);
      img.alt = boundStr(props.alt) || "image";
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const rawText = input.value.trim();
  if (!rawText && !attachedFile) return;

  // Active connectors
  const activeConnectors = [];
  if (document.getElementById("connector-flight").checked) activeConnectors.push("Flight & Hotel Connector");
  if (document.getElementById("connector-budget").checked) activeConnectors.push("Budget Specialist Skill");
  if (document.getElementById("connector-guide").checked) activeConnectors.push("Local Secrets Skill");

  // Construct message payload sent to Agent
  let finalPrompt = rawText;
  let userDisplay = rawText;

  if (attachedFile) {
    finalPrompt = `[ATTACHED DOCUMENT: ${attachedFile.name}]\n${attachedFile.content}\n\n[USER QUERY]\n${rawText || "Please analyze the attached travel document."}`;
    userDisplay = `📎 Attached Document: ${attachedFile.name}\n${rawText}`;
  }

  if (activeConnectors.length > 0) {
    finalPrompt = `[ACTIVE CONNECTORS/SKILLS: ${activeConnectors.join(", ")}]\n${finalPrompt}`;
  }

  bubble("user").textContent = userDisplay;
  input.value = "";
  
  // Reset attached file preview
  attachedFile = null;
  document.getElementById("file-input").value = "";
  renderAttachmentPreview();

  const b = bubble("agent");
  b.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: finalPrompt }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
